@for(ratingId of ratingArr; track ratingId; let i = $index){
<button mat-icon-button [color]="color" [id]="'star_' + i" [matTooltip]="ratingId.toString()" matTooltipPosition="above">
  <mat-icon> {{ showIcon(i) }} </mat-icon>
</button>
} @if(starCount === null || starCount === 0){
<mat-error> Star count is <strong>required</strong> and cannot be zero </mat-error>

} @if(showVotes){
<p class="body-2">
  Your rated <span class="body-2">{{ rating }}</span> /
  <span class="body-2">{{ starCount }}</span>
</p>
}
